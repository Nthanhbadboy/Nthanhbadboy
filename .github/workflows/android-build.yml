name: Build Release and Windows Packages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-all:
stores:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js (for web/webview assets if needed)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # --- 1. TỰ ĐỘNG SINH KEYSTORE RELEASE CHUẨN XỊN NGAY TRÊN SERVER ---
      - name: Generate Release Keystore
        run: |
          keytool -genkey -v -keystore release-key.jks -keyalg RSA -keysize 2048 -validity 10000 \
          -alias physicsdraw -passin pass:android -passout pass:android \
          -dname "CN=Physics Draw, OU=Dev, O=Nthanh, L=Haiphong, C=VN"

      # --- 2. BUILD ANDROID APKs (HUWEAI, AMAZON, SAMSUNG) ---
      - name: Build Android Release APKs
        working-directory: ./android-app
        run: |
          chmod +x gradlew
          # Build bản release chưa ký trước
          ./gradlew assembleRelease
          
          # Ký số trực tiếp bằng keystore vừa sinh tự động ở trên
          cd app/build/outputs/apk/release/
          for apk in *.apk; do
            if [ -f "$apk" ]; then
              filename=$(basename "$apk" .apk)
              jarsigner -keystore ../../../../../release-key.jks -storepass android -keypass android "$apk" physicsdraw
              mv "$apk" "../../../../../physics-draw-${filename}-release-signed.apk"
            fi
          done

      # --- 3. BUILD WINDOWS PACKAGE (.ZIP / PORTABLE) ---
      - name: Build Windows Package
        run: |
          mkdir -p windows-build/assets
          cp -r android-app/app/src/main/assets/* windows-build/assets/
          # Tạo gói nén portable cho Windows từ nội dung HTML5 / WebView wrapper
          cd windows-build
          zip -r ../physics-draw-windows-portable.zip .

      # --- 4. UPLOAD ARTIFACTS LÊN GITHUB ACTIONS ---
      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: physics-draw-release-apks
          path: physics-draw-*-release-signed.apk

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: physics-draw-windows-package
          path: physics-draw-windows-portable.zip
