name: Build Signed Android Release APKs

on:
  push:
    branches:
      - arena/667974da-nthanhbadboy
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build-android:
    name: Build signed Huawei, Amazon, and Samsung APKs
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager_path="$(find "$sdk_root" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          test -n "$sdkmanager_path"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$(dirname "$sdkmanager_path")" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          "$sdkmanager_path" --version

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Resolve release keystore
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          store_file="$GITHUB_WORKSPACE/android-app/release.keystore"

          missing=()
          [[ -n "${KEYSTORE_BASE64:-}" ]] || missing+=(ANDROID_KEYSTORE_BASE64)
          [[ -n "${KEYSTORE_PASSWORD:-}" ]] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [[ -n "${KEY_ALIAS:-}" ]] || missing+=(ANDROID_KEY_ALIAS)
          [[ -n "${KEY_PASSWORD:-}" ]] || missing+=(ANDROID_KEY_PASSWORD)
          if (( ${#missing[@]} > 0 )); then
            printf 'A real production release keystore is required. Missing GitHub Actions secret(s): %s\n' "${missing[*]}" >&2
            exit 1
          fi

          if ! printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$store_file"; then
            echo 'ANDROID_KEYSTORE_BASE64 is not valid base64.' >&2
            exit 1
          fi
          if ! keytool -list -v \
              -keystore "$store_file" \
              -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" \
              >/dev/null 2>&1; then
            echo 'The supplied production keystore, password, or alias could not be validated.' >&2
            exit 1
          fi

          echo 'mode=repository-secret' >> "$GITHUB_OUTPUT"
          echo 'A validated production release keystore was found and will be used; no temporary or unsigned APK will be produced.' >> "$GITHUB_STEP_SUMMARY"
          {
            echo "ANDROID_RELEASE_STORE_FILE=$store_file"
            echo "ANDROID_RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Clean Android build outputs
        run: |
          gradle --no-daemon -p android-app clean

      - name: Build signed release APKs
        shell: bash
        run: |
          set -o pipefail
          set +e
          gradle --no-daemon --refresh-dependencies --stacktrace --console=plain -p android-app \
            assembleHuaweiRelease \
            assembleAmazonRelease \
            assembleSamsungRelease 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"
          status=${PIPESTATUS[0]}
          if [[ "$status" -ne 0 ]]; then
            summary="$(grep -E 'FAILURE:|What went wrong:|Could not |Execution failed|error:|Caused by:' "$RUNNER_TEMP/gradle-build.log" | tail -n 20 | tr '\n' ' ' | cut -c1-900)"
            echo "::error file=android-app/app/build.gradle,line=1,title=Gradle build failure::$summary"
          fi
          exit "$status"

      - name: Collect and verify signed APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          apksigner="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          aapt2="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2"

          for flavor in huawei amazon samsung; do
            apk="$(find android-app/app/build/outputs/apk -type f -iname "*${flavor}*release*.apk" ! -iname '*unsigned*' | head -n 1)"
            test -n "$apk"
            "$apksigner" verify --verbose "$apk" >/dev/null

            audit="artifacts/${flavor}-apk-audit.txt"
            permissions="$RUNNER_TEMP/${flavor}-permissions.txt"
            "$aapt2" dump permissions "$apk" > "$permissions"
            {
              echo "APK: $apk"
              echo "SHA-256: $(sha256sum "$apk" | cut -d' ' -f1)"
              echo "--- merged permissions ---"
              cat "$permissions"
              echo "--- archive entries ---"
              unzip -Z1 "$apk"
              echo "--- payment/billing signatures ---"
            } > "$audit"

            # Inspect every text-bearing APK entry, not only classes.dex. This
            # catches signatures hidden in secondary dex files, resources, the
            # WebView asset, or a transitive native/library resource.
            apk_strings="$RUNNER_TEMP/${flavor}-apk-strings.txt"
            : > "$apk_strings"
            while IFS= read -r entry; do
              case "$entry" in
                *.dex|*.xml|*.arsc|*.so|*.json|*.txt|*.properties|*.html|*.js|*.css|*.bin)
                  unzip -p "$apk" "$entry" 2>/dev/null | strings >> "$apk_strings" || true
                  ;;
              esac
            done < <(unzip -Z1 "$apk")

            forbidden_pattern='com[./]android[./](vending|billing)|com[./]google[./]android[./](play[./]billing|billingclient)|com[./](stripe|paypal|braintree|adyen|razorpay)|BillingClient|GoogleBilling'
            forbidden_matches="$(grep -Eio "$forbidden_pattern" "$apk_strings" | sort -u || true)"
            if [[ -n "$forbidden_matches" ]]; then
              printf '%s\n' "$forbidden_matches" >> "$audit"
              echo "Forbidden third-party billing signature found in $apk" >&2
              exit 1
            fi
            echo "none" >> "$audit"

            if grep -Fq 'com.android.vending.BILLING' "$permissions"; then
              echo "Forbidden Google Play Billing permission found in $apk" >&2
              exit 1
            fi
            if [[ "$flavor" == "huawei" ]] && ! grep -Fq 'com.huawei.hms.iap' "$apk_strings"; then
              echo "Huawei APK is missing the official HMS Core IAP package" >&2
              exit 1
            fi
            if [[ "$flavor" != "huawei" ]] && grep -Fq 'com.huawei.hms.iap' "$apk_strings"; then
              echo "Non-Huawei APK contains the Huawei HMS Core IAP package" >&2
              exit 1
            fi

            cp "$apk" "artifacts/physics-draw-${flavor}-release-signed.apk"
          done

          sha256sum artifacts/*.apk | tee artifacts/SHA256SUMS.txt

      - name: Upload signed release APKs
        uses: actions/upload-artifact@v4
        with:
          name: physics-draw-release-apks
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Remove release keystore
        if: always()
        shell: bash
        run: rm -f android-app/release.keystore

      - name: Remove stale game artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          current_run="${{ github.run_id }}"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select((.name == \"physics-draw-release-apks\" or .name == \"physics-draw-apks\") and .workflow_run.id != ${current_run}) | .id" \
            | while read -r artifact_id; do
                test -z "$artifact_id" || gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
              done

