name: Build Physics Draw APKs

on:
  push:
    branches:
      - arena/667974da-nthanhbadboy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apks:
    name: Build Huawei, Amazon, and Samsung APKs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager_path="$(find "$sdk_root" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          test -n "$sdkmanager_path"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$(dirname "$sdkmanager_path")" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          "$sdkmanager_path" --version

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build signed debug APKs
        run: |
          gradle --no-daemon -p android-app \
            assembleHuaweiDebug \
            assembleAmazonDebug \
            assembleSamsungDebug

      - name: Collect signed APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for flavor in huawei amazon samsung; do
            debug_apk="$(find android-app/app/build/outputs/apk -type f -iname "*${flavor}*debug*.apk" | head -n 1)"
            test -n "$debug_apk"
            cp "$debug_apk" "artifacts/physics-draw-${flavor}-debug-signed.apk"
          done
          sha256sum artifacts/*.apk | tee artifacts/SHA256SUMS.txt

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: physics-draw-apks
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  package-windows:
    name: Package portable Windows web build
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Create portable package
        shell: pwsh
        run: |
          $package = "windows-package"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item "index.html" "$package/index.html"

          @'
          @echo off
          setlocal
          where py >nul 2>nul
          if %ERRORLEVEL% EQU 0 (
            start "Physics Draw server" cmd /c "py -m http.server 4173"
            timeout /t 1 /nobreak >nul
            start "Physics Draw" http://127.0.0.1:4173/index.html
          ) else (
            start "Physics Draw" index.html
          )
          '@ | Set-Content -Encoding ASCII "$package/Run-Physics-Draw.bat"

          @'
          Physics Draw portable Windows package
          Double-click Run-Physics-Draw.bat to start the game.
          Python 3 is recommended so the game runs from a local HTTP server;
          otherwise the launcher opens index.html directly in the default browser.
          An internet connection is required for the Matter.js and font CDN assets.
          '@ | Set-Content -Encoding UTF8 "$package/README.txt"

          Compress-Archive -Path "$package/*" -DestinationPath "physics-draw-windows.zip" -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: physics-draw-windows
          path: physics-draw-windows.zip
          if-no-files-found: error
          retention-days: 30
