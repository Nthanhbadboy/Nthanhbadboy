name: Build Water Ejector Huawei APK & Web Preview

on:
  push:
    branches:
      - arena/3028496c-nthanhbadboy
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-huawei-release:
    name: Analyze, Test, Build Huawei APK & Web
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter Stable SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter environment & install dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Run static analysis (flutter analyze)
        run: flutter analyze

      - name: Run unit & widget tests (flutter test)
        run: flutter test

      - name: Prepare optional release keystore from GitHub Secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          store_file="$GITHUB_WORKSPACE/android/release.keystore"
          if [[ -n "${KEYSTORE_BASE64:-}" && -n "${KEYSTORE_PASSWORD:-}" && -n "${KEY_ALIAS:-}" && -n "${KEY_PASSWORD:-}" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$store_file"
            echo "ANDROID_RELEASE_STORE_FILE=$store_file" >> "$GITHUB_ENV"
            echo "ANDROID_RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Using repository production keystore for signing."
          else
            echo "Repository keystore secrets not set; using fallback signing."
          fi

      - name: Build Android Release APK for Huawei AppGallery
        run: flutter build apk --release

      - name: Verify APK Package Name & HMS Petal Ads Integration
        shell: bash
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$apk"

          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          aapt2="$(find "$sdk_root/build-tools" -type f -name aapt2 | sort -V | tail -n 1)"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)"

          "$apksigner" verify --verbose "$apk"
          badging="$("$aapt2" dump badging "$apk")"
          echo "$badging" | head -n 5
          echo "$badging" | grep -Fq "package: name='NGUYENMINHTHANH.WaterEjector'"

          mkdir -p dist-apk
          cp "$apk" dist-apk/WaterEjector-NGUYENMINHTHANH.WaterEjector-huawei-release.apk
          sha256sum dist-apk/*.apk > dist-apk/SHA256SUMS.txt

      - name: Build Flutter Web Release Preview
        run: flutter build web --release

      - name: Clean up temporary keystore
        if: always()
        run: rm -f android/release.keystore

      - name: Upload Huawei Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: water-ejector-huawei-apk
          path: dist-apk/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Web Preview Artifact
        uses: actions/upload-artifact@v4
        with:
          name: water-ejector-web-preview
          path: build/web/
          if-no-files-found: error
          retention-days: 7
