name: water_ejector
description: "Water Ejector: Speaker Cleaner - Multilingual (9 languages) 165Hz Speaker Cleaner & Audio Tester built for Huawei AppGallery with pure Huawei Petal Ads SDK."
publish_to: 'none'

# Phiên bản phát hành chính thức lên Huawei AppGallery (versionName: 1.2.0, versionCode: 4)
version: 1.2.0+4

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Đa ngôn ngữ Quốc tế (Internationalization - i18n cho 9 ngôn ngữ)
  flutter_localizations:
    sdk: flutter
  intl: ">=0.19.0 <1.0.0"

  # Bộ icon giao diện chuẩn
  cupertino_icons: ^1.0.8

  # Huawei Petal Ads SDK chính thức cho hệ sinh thái HMS / AppGallery (KHÔNG dùng AdMob)
  huawei_ads: ^13.4.72+300

  # Lưu trạng thái đồng ý Chính sách Bảo mật lần đầu (is_privacy_accepted) & ngôn ngữ đã chọn
  shared_preferences: ^2.3.3

  # Engine phát âm thanh tần số chuẩn PCM 16-bit độ trễ thấp (hỗ trợ BytesSource & AssetSource)
  audioplayers: ^6.1.0

  # Quản lý trạng thái (State Management) cho âm thanh, quyền riêng tư & đổi ngôn ngữ linh hoạt
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/audio/
